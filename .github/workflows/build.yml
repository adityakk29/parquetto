name: Build Windows EXE

# Builds Parquetto.exe on an actual Windows runner (PyInstaller can't
# cross-compile, so this has to run on windows-latest, not Linux/macOS).
#
# - Push a tag like "v1.0.0" -> builds the exe AND creates/updates a
#   GitHub Release with the exe attached, so anyone can download it from
#   the Releases page without installing Python.
# - Any other push/PR, or manually via "Run workflow" -> just builds the
#   exe and uploads it as a workflow artifact, for testing.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: >
          pyinstaller --onefile --windowed --name Parquetto
          --icon assets/icon.ico
          --add-data "assets/icon_128.png;assets"
          main.py

      - name: Upload build artifact
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: Parquetto-windows
          path: dist/Parquetto.exe

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Parquetto.exe
          fail_on_unmatched_files: true
          overwrite_files: true
